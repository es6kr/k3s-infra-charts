namespace: wiki

image:
  repository: ghcr.io/openclaw/openclaw
  tag: "2026.7.1"          # upstream, unmodified — not a custom image
  pullPolicy: IfNotPresent

persistence:
  storageClassName: local-path
  size: 2Gi

gateway:
  port: 18789
  bind: lan

# Runtime-installed model-provider dependencies (installed into the PVC by the
# init container, not baked into the image). Pin versions to avoid drift.
runtimePackages:
  - "@openclaw/acpx@2026.7.1"
  - "@anthropic-ai/claude-code@2.1.246"

# commands.ownerAllowFrom — Discord user IDs allowed to run owner-level commands
ownerAllowFrom:
  - "796338842893287444"

agents:
  - id: wiki-ask
    model: openai/gpt-5.5
    fallback:
      - claude-cli/claude-sonnet-5
    discord:
      accountId: dgs-openclaw
      channelId: "1527670206300688384"
      requireMention: false
  - id: wiki-ask-claude
    model: claude-cli/claude-sonnet-5
    fallback:
      - openai/gpt-5.5
    discord:
      accountId: dgs-claude
      channelId: "1527670206300688384"
      requireMention: true

discord:
  guildId: "1527649090949611620"
  accounts:
    dgs-openclaw:
      enabled: true
    dgs-claude:
      enabled: true

# Secret keys expected inside existingSecret (all token/credential values —
# never set these directly in values.yaml or a values override committed to git):
#   GATEWAY_TOKEN
#   DISCORD_TOKEN_DGS_OPENCLAW
#   DISCORD_TOKEN_DGS_CLAUDE
#   ANTHROPIC_SETUP_TOKEN   (sk-ant-oat01-... from `claude setup-token`)
existingSecret: openclaw-dgs-secrets

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1000m"
    memory: 1536Mi
