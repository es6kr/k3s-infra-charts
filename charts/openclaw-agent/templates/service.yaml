apiVersion: v1
kind: Service
metadata:
  name: {{ include "openclaw-agent.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openclaw-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "openclaw-agent.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}
